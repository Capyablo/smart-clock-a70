<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><meta name="description" content="Reloj inteligente para Galaxy A70"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>A70 Smart Clock</title>
<style>
:root{color-scheme:dark;--bg:#05070b;--panel:#0d121a;--line:#202a38;--text:#f2f6fb;--muted:#8794a4;--blue:#70adff;--mint:#75e0c0}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:clamp(14px,4vw,48px)}main{width:min(1080px,100%);min-height:90svh;display:flex;flex-direction:column;justify-content:space-between;gap:22px}.top,.brand,.actions,.foot,.row,.heading,.weatherMain{display:flex;align-items:center;justify-content:space-between}.brand{justify-content:flex-start;gap:12px;color:#9ba8b7;font-size:11px;font-weight:800;letter-spacing:.18em}.badge{border:1px solid #314866;border-radius:9px;padding:8px;color:var(--blue);letter-spacing:.04em}.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--blue);font:inherit;padding:10px 14px;cursor:pointer}.clock{text-align:center}.time{font-size:clamp(92px,20vw,210px);font-weight:500;letter-spacing:-.09em;line-height:1;font-variant-numeric:tabular-nums}.date{color:#aab4c1;text-transform:capitalize;letter-spacing:.06em;margin-top:14px}.panels{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}.panel{background:linear-gradient(145deg,#101722,#090c12);border:1px solid var(--line);border-radius:20px;padding:20px;min-height:165px}.heading{justify-content:flex-start;gap:10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em}.weatherMain{justify-content:flex-start;gap:14px;margin:18px 0}.weatherMain strong{font-size:36px}.weatherIcon{font-size:38px}.muted{color:var(--muted);font-size:13px}.row{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}.alarms{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0;min-height:30px}.alarm{background:#151e2a;border:1px solid #283648;border-radius:9px;padding:7px 10px;font-variant-numeric:tabular-nums}.alarm button{border:0;background:none;color:var(--muted);cursor:pointer}.alarmForm{display:flex;gap:8px;margin-top:12px}.alarmForm input{background:#070a0f;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.mic{font-size:18px;border-radius:50%;width:44px;height:44px}.foot{border-top:1px solid #18202b;padding-top:12px;color:#718094;font-size:11px;gap:14px}.status{color:var(--mint)}#reply{flex:1;text-align:center}.night{--bg:#000;--panel:#030405;--text:#707987;--muted:#4e5968;--blue:#52647c}.night .time{color:#85909e}.night .panel{background:#030405;border-color:#101215}@media(max-width:650px){main{min-height:calc(100svh - 28px);gap:16px}.panels{grid-template-columns:1fr}.panel{min-height:auto;padding:16px}.clock{padding:8px 0}.foot span:last-child{display:none}}@media(max-height:520px) and (orientation:landscape){body{padding:10px 4vw}main{min-height:calc(100svh - 20px);gap:8px}.time{font-size:min(29vh,150px)}.date{margin-top:4px}.panel{min-height:110px;padding:10px 16px}.weatherMain{margin:7px 0}.weatherMain strong{font-size:27px}.weatherIcon{font-size:29px}.foot{padding-top:7px}}
</style></head><body><main><header class="top"><div class="brand"><span class="badge">A70</span> SMART CLOCK</div><div class="actions"><button class="btn mic" id="mic" title="Hablar">🎙</button><button class="btn" id="night">☾</button></div></header>
<section class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">Cargando fecha…</div></section>
<section class="panels"><article class="panel"><div class="heading">EL TIEMPO <span>·</span> AHORA</div><div class="weatherMain"><span id="icon" class="weatherIcon">☁</span><div><strong id="temp">--°</strong><div id="weather" class="muted">Pulsa actualizar</div></div></div><div class="row"><span id="place">Tu ubicación</span><button class="btn" id="refresh">Actualizar</button></div></article>
<article class="panel"><div class="heading">ALARMAS <span id="count" class="muted">0 activas</span></div><div id="alarms" class="alarms"></div><form id="alarmForm" class="alarmForm"><input id="alarmTime" type="time" value="07:00" required aria-label="Hora de alarma"><button class="btn" type="submit">Añadir alarma</button></form></article></section>
<footer class="foot"><span class="status" id="status">LISTO</span><span id="reply">Pulsa 🎙 para preguntar por hora, fecha, tiempo o alarmas</span><span>GALAXY A70 · HORIZONTAL</span></footer></main>
<script>
const $=s=>document.querySelector(s);function tick(){const d=new Date();$('#time').textContent=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('#date').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(d);checkAlarms()}tick();setInterval(tick,1000);
function getAlarms(){try{return JSON.parse(localStorage.getItem('a70-alarms')||'[]')}catch{return []}}function saveAlarms(a){localStorage.setItem('a70-alarms',JSON.stringify(a));render()}function render(){const box=$('#alarms'),items=getAlarms();box.replaceChildren();items.forEach((a,i)=>{const el=document.createElement('span');el.className='alarm';el.textContent=a.time+' ';const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Eliminar alarma');del.onclick=()=>{items.splice(i,1);saveAlarms(items)};el.append(del);box.append(el)});$('#count').textContent=items.length+' activas'}render();$('#alarmForm').onsubmit=e=>{e.preventDefault();const t=$('#alarmTime').value,a=getAlarms();if(!a.some(x=>x.time===t)){a.push({time:t});a.sort((x,y)=>x.time.localeCompare(y.time));saveAlarms(a)}say('Alarma añadida a las '+t)};
let audio;function checkAlarms(){const now=new Date(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),key=now.toDateString()+t;let fired=localStorage.getItem('a70-fired');if(fired===key)return;const a=getAlarms().find(x=>x.time===t);if(a){localStorage.setItem('a70-fired',key);say('¡Buenos días! Es la hora de levantarse.');try{audio??=new AudioContext();audio.resume();for(let i=0;i<8;i++){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.001,audio.currentTime+i*.5);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+i*.5+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+i*.5+.3);o.connect(g).connect(audio.destination);o.start(audio.currentTime+i*.5);o.stop(audio.currentTime+i*.5+.32)}}catch{}}}
function say(t){$('#reply').textContent=t;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.speak(u)}}$('#night').onclick=()=>{document.body.classList.toggle('night');$('#night').textContent=document.body.classList.contains('night')?'☀':'☾';localStorage.setItem('a70-night',document.body.classList.contains('night')?'1':'0')};if(localStorage.getItem('a70-night')==='1')document.body.classList.add('night');
async function weather(lat,lon){$('#weather').textContent='Consultando…';try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto'),d=await r.json(),c=d.current;$('#temp').textContent=Math.round(c.temperature_2m)+'°';const desc={0:['Despejado','☀'],1:['Mayormente despejado','🌤'],2:['Parcialmente nublado','⛅'],3:['Nublado','☁'],45:['Niebla','🌫'],61:['Lluvia','🌧'],63:['Lluvia','🌧'],65:['Lluvia fuerte','🌧'],80:['Chubascos','🌦'],95:['Tormenta','⛈']},x=desc[c.weather_code]||['Tiempo actual','☁'];$('#weather').textContent=x[0];$('#icon').textContent=x[1];$('#place').textContent='Ubicación aproximada'}catch{$('#weather').textContent='Sin conexión'}}function refresh(){if(!navigator.geolocation){$('#weather').textContent='Ubicación no disponible';return}navigator.geolocation.getCurrentPosition(p=>weather(p.coords.latitude,p.coords.longitude),()=>{$('#weather').textContent='Permite la ubicación en Chrome'},{timeout:10000})}$('#refresh').onclick=refresh;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='es-ES';rec.onstart=()=>$('#status').textContent='ESCUCHANDO';rec.onend=()=>$('#status').textContent='LISTO';rec.onerror=e=>say(e.error==='not-allowed'?'Permite el micrófono en Chrome':'No te he oído. Inténtalo de nuevo');rec.onresult=e=>{const c=e.results[0][0].transcript.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(c.includes('hora'))say('Son las '+$('#time').textContent);else if(c.includes('fecha')||c.includes('dia'))say('Hoy es '+$('#date').textContent);else if(c.includes('tiempo')||c.includes('temperatura'))say('Ahora hay '+$('#temp').textContent+' y está '+$('#weather').textContent);else if(c.includes('mis alarmas')||c.includes('que alarmas')){const a=getAlarms();say(a.length?'Tienes alarmas a las '+a.map(x=>x.time).join(' y '):'No tienes alarmas activas')}else say('Puedo decirte la hora, la fecha, el tiempo y tus alarmas')};$('#mic').onclick=()=>{try{rec.start()}catch{say('Pulsa de nuevo para hablar')}}}else{$('#mic').disabled=true;$('#reply').textContent='Este navegador no admite voz'}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
